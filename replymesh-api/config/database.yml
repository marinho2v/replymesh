default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DATABASE_HOST", ENV.fetch("DB_HOST", "localhost")) %>
  port: <%= ENV.fetch("DATABASE_PORT", ENV.fetch("DB_PORT", 5432)) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", ENV.fetch("DB_USERNAME", "postgres")) %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", ENV.fetch("DB_PASSWORD", "")) %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "replymesh_development") %>

test:
  <<: *default
  database: replymesh_test

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "replymesh_production") %>
